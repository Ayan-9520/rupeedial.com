<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Base Title (React pages override this) -->
    <title> RupeeDial</title>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Description (React can override) -->
    <meta
      name="description"
      content="Compare and apply for MSME, personal, home and business loans in India. Check loan eligibility online across top banks & NBFCs with RupeeDial."
    />

    <!-- Canonical (React pages can update dynamically) -->
    <link rel="canonical" href="https://rupeedial.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-rupeedial.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-titlelogo.png" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RupeeDial" />
    <meta property="og:url" content="https://rupeedial.com/" />
    <meta
      property="og:title"
      content="Compare Loans in India | MSME, Personal & Home Loans - RupeeDial"
    />
    <meta
      property="og:description"
      content="Compare MSME, personal, home and business loans across top banks & NBFCs in India with RupeeDial."
    />
    <meta property="og:image" content="https://rupeedial.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RupeeDial " />
    <meta
      name="twitter:description"
      content="Check eligibility and compare MSME, personal & home loans online with RupeeDial."
    />
    <meta name="twitter:image" content="https://rupeedial.com/og-image.png" />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RupeeDial",
        "url": "https://rupeedial.com",
        "logo": "https://rupeedial.com/logo.png",
        "sameAs": [
          "https://www.facebook.com/rupeedial",
          "https://www.linkedin.com/company/rupeedial"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
