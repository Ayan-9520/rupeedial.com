<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Base Title (React pages override this) -->
    <title> RupeeDial</title>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Description (React can override) -->
    <meta
      name="description"
      content="RupeeDial is India's financial marketplace and distribution network. Compare loans, get expert assistance, or grow as a financial partner."
    />

    <!-- Canonical (React pages can update dynamically) -->
    <link rel="canonical" href="https://rupeedial.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-rupeedial.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-titlelogo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RupeeDial" />
    <meta property="og:url" content="https://rupeedial.com/" />
    <meta
      property="og:title"
      content="RupeeDial | Financial Marketplace & Distribution Network"
    />
    <meta
      property="og:description"
      content="Compare loans, get expert assistance, or build a financial distribution business with RupeeDial."
    />
    <meta property="og:image" content="https://rupeedial.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RupeeDial " />
    <meta
      name="twitter:description"
      content="Compare loans, get expert assistance, or grow as a RupeeDial financial partner."
    />
    <meta name="twitter:image" content="https://rupeedial.com/og-image.png" />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RupeeDial",
        "url": "https://rupeedial.com",
        "logo": "https://rupeedial.com/logo.png",
        "sameAs": [
          "https://www.facebook.com/rupeedial",
          "https://www.linkedin.com/company/rupeedial"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
